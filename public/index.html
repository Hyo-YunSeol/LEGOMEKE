<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b5ff5">
  <meta name="description" content="레고방 포인트 경쟁 소셜 다마고치">
  <title>레고 키우기</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=69201">
  <link rel="stylesheet" href="/styles.css?v=69201">
</head>
<body>
  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>레고 키우기</h1>
      <p>포인트를 벌고, 레벨을 키우고, 레고방에서 경쟁하세요.</p>
      <div class="auth-tabs" role="tablist">
        <button class="tab-button active" data-auth-tab="login" type="button">로그인</button>
        <button class="tab-button" data-auth-tab="register" type="button">처음 시작</button>
      </div>
      <form id="login-form" class="auth-form">
        <label>닉네임<input name="nickname" maxlength="12" autocomplete="username" required placeholder="예: 윤설"></label>
        <label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="current-password" required placeholder="숫자 4~12자리"></label>
        <button class="primary wide" type="submit">내 레고 만나기</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <label>닉네임<input name="nickname" maxlength="12" autocomplete="username" required placeholder="레고 앞에 붙을 이름"></label>
        <label>PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="new-password" required placeholder="다음 접속 때 사용할 숫자"></label>
        <p class="register-warning">※ 반드시 레고방에서 사용 중인 본인 닉네임으로 가입해주세요.본인 닉네임이 아닌 계정은 확인 후 관리자가 별도 안내 없이 삭제할 수 있습니다.</p>
        <button class="primary wide" type="submit">첫 레고 만들기</button>
      </form>
      <p class="auth-note">강퇴되면 같은 계정에서 다음 세대 레고로 다시 시작할 수 있습니다.</p>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <header class="topbar">
      <button class="brand-button" data-action="home" type="button"><span class="mini-brand" aria-hidden="true"></span><strong>레고 키우기</strong></button>
      <div class="top-actions">
        <button class="status-pill" data-action="show-online" type="button"><span class="online-dot"></span><span id="online-count">0</span>명</button>
        <button class="icon-button" data-action="notifications" type="button" aria-label="알림">🔔<span id="notification-badge" class="badge hidden">0</span></button>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-item active" data-tab="home" data-allow-busy="true" type="button"><span>🏠</span><small>내 레고</small></button>
      <button class="nav-item" data-tab="games" data-allow-busy="true" type="button"><span>🎮</span><small>게임</small></button>
      <button class="nav-item" data-tab="territory" data-allow-busy="true" type="button"><span>🗺️</span><small>영토전</small></button>
      <button class="nav-item" data-tab="social" data-allow-busy="true" type="button"><span>👥</span><small>관계·벙</small></button>
      <button class="nav-item" data-tab="records" data-allow-busy="true" type="button"><span>📖</span><small>기록</small></button>
    </nav>
  </div>

  <div id="loudspeaker-root" class="loudspeaker-root hidden" aria-live="assertive"></div>

  <div id="modal-root" class="modal-root hidden" aria-hidden="true">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <section id="modal-content" class="modal" role="dialog" aria-modal="true"></section>
  </div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script type="module" src="/app.js?v=69201"></script>
</body>
</html>
